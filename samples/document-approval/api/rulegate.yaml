schemaVersion: 1

application:
  id: rulegate-document-approval
  name: RuleGate Document Approval

policies:
  - id: documents-list
    resourceType: document
    action: list
    requirement:
      permission: DOC.READ

  - id: document-read
    resourceType: document
    action: read
    requirement:
      all:
        - permission: DOC.READ
        - attributeComparison:
            left:
              source: subject
              name: organizationId
            operator: equal
            right:
              source: resource
              name: organizationId

  - id: document-create
    resourceType: document
    action: create
    requirement:
      all:
        - permission: DOC.CREATE
        - context:
            property: requestChannel
            operator: equal
            valueType: string
            value: api

  - id: document-update
    resourceType: document
    action: update
    requirement:
      all:
        - permission: DOC.UPDATE
        - attribute:
            source: resource
            name: status
            operator: equal
            valueType: string
            value: draft
        - attributeComparison:
            left:
              source: subject
              name: username
            operator: equal
            right:
              source: resource
              name: ownerUsername

  - id: document-submit
    resourceType: document
    action: submit
    requirement:
      all:
        - permission: WFL.START
        - attribute:
            source: resource
            name: status
            operator: equal
            valueType: string
            value: draft
        - attributeComparison:
            left:
              source: subject
              name: username
            operator: equal
            right:
              source: resource
              name: ownerUsername

  - id: document-approve
    resourceType: document
    action: approve
    requirement:
      all:
        - permission: WFL.APPROVE
        - role: keycloak:realm:APPROVER
        - attribute:
            source: resource
            name: status
            operator: equal
            valueType: string
            value: submitted
        - attributeComparison:
            left:
              source: subject
              name: organizationId
            operator: equal
            right:
              source: resource
              name: organizationId
        - not:
            attributeComparison:
              left:
                source: subject
                name: username
              operator: equal
              right:
                source: resource
                name: ownerUsername

  - id: document-reject
    resourceType: document
    action: reject
    requirement:
      all:
        - permission: WFL.REJECT
        - role: keycloak:realm:APPROVER
        - attribute:
            source: resource
            name: status
            operator: equal
            valueType: string
            value: submitted
        - attributeComparison:
            left:
              source: subject
              name: organizationId
            operator: equal
            right:
              source: resource
              name: organizationId
        - not:
            attributeComparison:
              left:
                source: subject
                name: username
              operator: equal
              right:
                source: resource
                name: ownerUsername
