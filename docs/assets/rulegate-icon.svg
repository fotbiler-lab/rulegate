    <circle cx="90" cy="72" r="30" fill="#eef9ff" stroke="#062d4d" stroke-width="5"/>
    <path
      d="M90 55a13 13 0 0 0-7 24l-5 25h24l-5-25a13 13 0 0 0-7-24Z"
