      <stop offset="0" stop-color="#79c9f5"/>
      <stop offset="0.52" stop-color="#2789ca"/>
      <stop offset="1" stop-color="#075b9a"/>
    </linearGradient>
    <linearGradient id="shield-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d5f1ff"/>
      <stop offset="1" stop-color="#0a4f83"/>
