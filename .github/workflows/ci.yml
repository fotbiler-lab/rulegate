name: CI

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  angular-package:
    name: Build, test, and pack Angular SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Angular SDK dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Angular SDK formatting
        run: pnpm angular:format:check

      - name: Build Angular SDK
        run: pnpm angular:build

      - name: Test Angular SDK
        run: pnpm angular:test

      - name: Test npm package consumer
        run: ./scripts/test-angular-package-smoke.sh --package-ready

      - name: Verify reference Angular application
        run: |
          pnpm samples:format:check
          pnpm samples:generate:check
          pnpm samples:build

      - name: Upload npm package
        uses: actions/upload-artifact@v6
        with:
          name: rulegate-angular-npm-package
          path: artifacts/npm/*.tgz
          if-no-files-found: error
          retention-days: 14

  angular-compatibility:
    name: Angular ${{ matrix.angular }} package consumer
    needs: angular-package
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        angular: [9, 11, 12, 15, 16, 19, 20, 21, 22]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download packed frontend packages
        uses: actions/download-artifact@v7
        with:
          name: rulegate-angular-npm-package
          path: artifacts/npm

      - name: Test package-only Angular consumer
        run: ./scripts/test-angular-compatibility.sh ${{ matrix.angular }}

  build-test-pack:
    name: Build, test, pack, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
          global-json-file: global.json

      - name: Show .NET information
        run: dotnet --info

      - name: Restore
        run: |
          dotnet restore \
            Fotbiler.RuleGate.slnx

      - name: Verify formatting
        run: |
          dotnet format \
            Fotbiler.RuleGate.slnx \
            --verify-no-changes \
            --no-restore

      - name: Build
        run: |
          dotnet build \
            Fotbiler.RuleGate.slnx \
            --configuration Release \
            --no-restore

      - name: Test
        run: |
          dotnet test \
            Fotbiler.RuleGate.slnx \
            --configuration Release \
            --no-build \
            --logger trx \
            --results-directory TestResults

      - name: Run bounded concurrency stress
        run: ./scripts/test-concurrency-stress.sh 3

      - name: Validate benchmark suite
        run: ./scripts/test-benchmarks.sh

      - name: Pack
        run: |
          dotnet pack \
            Fotbiler.RuleGate.slnx \
            --configuration Release \
            --no-build

      - name: Test current and legacy NuGet package consumers
        run: |
          ./scripts/test-dotnet-legacy-consumers.sh \
            --packages-ready

      - name: Test RuleGate CLI tool
        run: |
          ./scripts/test-cli-tool-smoke.sh \
            --packages-ready

      - name: Test generated C# compilation
        run: |
          ./scripts/test-generated-code-smoke.sh \
            --packages-ready

      - name: Test reference applications
        run: ./scripts/test-reference-applications.sh --no-build

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v6
        with:
          name: rulegate-nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rulegate-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14
