name: CI

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  angular-package:
    name: Build, test, and pack Angular SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Angular SDK dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit npm dependency graph
        run: pnpm audit

      - name: Verify Angular SDK formatting
        run: pnpm angular:format:check

      - name: Build Angular SDK
        run: pnpm angular:build

      - name: Verify frontend public API freeze
        run: pnpm api:frontend:check

      - name: Verify npm artifact reproducibility
        run: ./scripts/verify-npm-artifact-reproducibility.sh

      - name: Test Angular SDK
        run: pnpm angular:test

      - name: Test npm package consumer
        run: ./scripts/test-angular-package-smoke.sh

      - name: Verify reference Angular application
        run: |
          pnpm samples:format:check
          pnpm samples:generate:check
          pnpm samples:build

      - name: Upload npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rulegate-angular-npm-package
          path: artifacts/npm/*.tgz
          if-no-files-found: error
          retention-days: 14

  angular-compatibility:
    name: Angular ${{ matrix.angular }} package consumer
    needs: angular-package
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        angular: [9, 11, 12, 15, 16, 19, 20, 21, 22]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download packed frontend packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: rulegate-angular-npm-package
          path: artifacts/npm

      - name: Test package-only Angular consumer
        run: ./scripts/test-angular-compatibility.sh ${{ matrix.angular }}

  build-test-pack:
    name: Build, test, pack, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release-state documentation
        run: node scripts/verify-release-state.mjs

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
          global-json-file: global.json

      - name: Show .NET information
        run: dotnet --info

      - name: Restore
        run: |
          dotnet restore \
            Fotbiler.RuleGate.slnx

      - name: Verify formatting
        run: |
          dotnet format \
            Fotbiler.RuleGate.slnx \
            --verify-no-changes \
            --no-restore

      - name: Build
        run: |
          dotnet build \
            Fotbiler.RuleGate.slnx \
            --configuration Release \
            --no-restore

      - name: Verify production Regex surface
        run: ./scripts/verify-no-production-regex.sh

      - name: Verify sensitive diagnostics surface
        run: ./scripts/verify-sensitive-diagnostics-surface.sh 1.0.0

      - name: Verify NuGet payload reproducibility
        run: ./scripts/verify-nuget-payload-reproducibility.sh 1.0.0

      - name: Restore default-version build state
        run: |
          dotnet restore \
            Fotbiler.RuleGate.slnx \
            --locked-mode

          dotnet build \
            Fotbiler.RuleGate.slnx \
            --configuration Release \
            --no-restore

      - name: Verify .NET public API freeze
        run: ./scripts/verify-dotnet-api-freeze.sh --no-build

      - name: Test
        run: |
          dotnet test \
            Fotbiler.RuleGate.slnx \
            --configuration Release \
            --no-build \
            --logger trx \
            --results-directory TestResults

      - name: Run bounded concurrency stress
        run: ./scripts/test-concurrency-stress.sh 3

      - name: Validate benchmark suite
        run: ./scripts/test-benchmarks.sh

      - name: Pack and verify .NET public API compatibility
        run: |
          dotnet pack \
            Fotbiler.RuleGate.slnx \
            --configuration Release \
            --no-build

      - name: Test current and legacy NuGet package consumers
        run: |
          ./scripts/test-dotnet-package-consumer-matrix.sh \
            1.0.0 \
            1.0.0-rc.1

      - name: Test RuleGate CLI tool
        run: |
          ./scripts/test-cli-tool-smoke.sh \
            --packages-ready

      - name: Test generated C# compilation
        run: |
          ./scripts/test-generated-code-smoke.sh \
            --packages-ready

      - name: Test reference applications
        run: ./scripts/test-reference-applications.sh --no-build

      - name: Upload NuGet packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rulegate-nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rulegate-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14
