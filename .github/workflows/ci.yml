name: CI

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test-pack:
    name: Build, test, pack, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Show .NET information
        run: dotnet --info

      - name: Restore
        run: |
          dotnet restore \
            Fotbiler.RuleGate.slnx

      - name: Verify formatting
        run: |
          dotnet format \
            Fotbiler.RuleGate.slnx \
            --verify-no-changes \
            --no-restore

      - name: Build
        run: |
          dotnet build \
            Fotbiler.RuleGate.slnx \
            --configuration Release \
            --no-restore

      - name: Test
        run: |
          dotnet test \
            Fotbiler.RuleGate.slnx \
            --configuration Release \
            --no-build \
            --logger trx \
            --results-directory TestResults

      - name: Pack
        run: |
          dotnet pack \
            Fotbiler.RuleGate.slnx \
            --configuration Release \
            --no-build

      - name: Test NuGet package consumer
        run: |
          ./scripts/test-nuget-consumer-smoke.sh \
            --packages-ready

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v6
        with:
          name: rulegate-nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rulegate-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14
