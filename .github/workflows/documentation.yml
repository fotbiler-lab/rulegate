name: Documentation

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/build-wiki.mjs'
      - 'scripts/verify-release-state.mjs'
      - 'scripts/verify-documentation.mjs'
      - '.github/workflows/documentation.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'scripts/build-wiki.mjs'
      - 'scripts/verify-release-state.mjs'
      - 'scripts/verify-documentation.mjs'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Verify Markdown links and guide inventory
        run: node scripts/verify-documentation.mjs

      - name: Verify release-state documentation
        run: node scripts/verify-release-state.mjs

      - name: Build GitHub Wiki edition
        run: node scripts/build-wiki.mjs

      - name: Upload generated Wiki
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rulegate-wiki
          path: artifacts/wiki
          if-no-files-found: error
