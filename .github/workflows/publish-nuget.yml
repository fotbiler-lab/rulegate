name: Publish NuGet

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: read

concurrency:
  group: publish-nuget-${{ inputs.tag }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish:
    name: Publish NuGet packages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment: nuget-production

    permissions:
      contents: read
      id-token: write

    env:
      EXPECTED_TAG: v1.0.0
      EXPECTED_PACKAGE_VERSION: 1.0.0
      NUGET_SOURCE: https://api.nuget.org/v3/index.json

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail

          requested_tag='${{ inputs.tag }}'

          if [[ "$requested_tag" != "$EXPECTED_TAG" ]]
          then
            echo "ERROR: Unexpected release tag."
            echo "Expected: $EXPECTED_TAG"
            echo "Actual:   $requested_tag"
            exit 1
          fi

          if [[ "$(
            git cat-file \
              -t \
              "$EXPECTED_TAG"
          )" != "tag" ]]
          then
            echo "ERROR: Release tag is not an annotated tag."
            exit 1
          fi

          tag_commit="$(
            git rev-parse \
              "$EXPECTED_TAG^{commit}"
          )"

          head_commit="$(
            git rev-parse \
              HEAD
          )"

          printf 'Tag commit:  %s\n' "$tag_commit"
          printf 'HEAD commit: %s\n' "$head_commit"

          if [[ "$tag_commit" != "$head_commit" ]]
          then
            echo "ERROR: Checkout does not match the release tag."
            exit 1
          fi

          if [[ -n "$(git status --porcelain)" ]]
          then
            echo "ERROR: Working tree is not clean."
            git status --short
            exit 1
          fi

      - name: Verify release-state documentation
        run: node scripts/verify-release-state.mjs

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
          global-json-file: global.json

      - name: Verify release packages
        run: |
          ./scripts/verify-preview-release.sh

      - name: Verify NuGet version availability
        shell: bash
        run: |
          set -euo pipefail

          package_ids=(
            "Fotbiler.RuleGate.Abstractions"
            "Fotbiler.RuleGate.Core"
            "Fotbiler.RuleGate.Manifest"
            "Fotbiler.RuleGate.AspNetCore"
            "Fotbiler.RuleGate.Cli"
            "Fotbiler.RuleGate.Keycloak"
          )

          for package_id in "${package_ids[@]}"
          do
            normalized_package_id="${package_id,,}"
            package_url="https://api.nuget.org/v3-flatcontainer/$normalized_package_id/$EXPECTED_PACKAGE_VERSION/$normalized_package_id.$EXPECTED_PACKAGE_VERSION.nupkg"
            status_code="$(
              curl \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                "$package_url"
            )"

            if [[ "$status_code" == "200" ]]
            then
              echo "ERROR: NuGet package version already exists: $package_id@$EXPECTED_PACKAGE_VERSION"
              exit 1
            fi

            if [[ "$status_code" != "404" ]]
            then
              echo "ERROR: NuGet version availability could not be determined: $package_id"
              echo "HTTP status: $status_code"
              exit 1
            fi

            echo "Available: $package_id@$EXPECTED_PACKAGE_VERSION"
          done

      - name: Upload verified NuGet packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rulegate-${{ inputs.tag }}-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 30

      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: fotbiler

      - name: Publish NuGet packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          package_ids=(
            "Fotbiler.RuleGate.Abstractions"
            "Fotbiler.RuleGate.Core"
            "Fotbiler.RuleGate.Manifest"
            "Fotbiler.RuleGate.AspNetCore"
            "Fotbiler.RuleGate.Cli"
            "Fotbiler.RuleGate.Keycloak"
          )

          for package_id in "${package_ids[@]}"
          do
            package_path="artifacts/packages/$package_id.$EXPECTED_PACKAGE_VERSION.nupkg"

            printf '\n== Publish %s ==\n' "$package_id"

            dotnet nuget push \
              "$package_path" \
              --api-key "$NUGET_API_KEY" \
              --source "$NUGET_SOURCE" \
              --symbol-api-key "$NUGET_API_KEY" \
              --symbol-source "$NUGET_SOURCE" \
              --timeout 600
          done

          echo "All RuleGate NuGet packages were submitted to NuGet.org."
